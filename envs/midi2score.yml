# MIDI2ScoreTransformer (MIDI -> MusicXML), updated to recent library versions
# (transformers 5.x, lightning 2.x) through patches/midi2scoretransformer.patch.
name: tfg-m2s
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - torch==2.10.0
      - lightning==2.6.1
      - transformers==5.2.0
      - numpy==2.4.2
      - pretty_midi==0.2.11
      - mido==1.3.3
      # Forks required by the original repository (see its README):
      - git+https://github.com/TimFelixBeyer/music21.git
      - git+https://github.com/TimFelixBeyer/ScoreTransformer.git 

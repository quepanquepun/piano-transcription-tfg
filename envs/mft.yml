# MFT-FiLM (audio -> MIDI). Python 3.9 as in the original repository.
name: tfg-mft
channels:
  - conda-forge
dependencies:
  - python=3.9
  - ffmpeg          # mp3 decoding for librosa
  - pip
  - pip:
      - torch==2.5.1
      - torchaudio==2.5.1
      - numpy==2.0.1
      - scipy==1.13.1
      - librosa==0.11.0
      - pretty_midi==0.2.11
      - mir_eval==0.8.2
      - scikit-learn==1.6.1
      - matplotlib==3.9.4
